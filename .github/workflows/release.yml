name: Release

# 打 v* 标签时触发：三平台矩阵构建 Tauri 安装包，统一传到一个草稿 Release，
# 全部完成后人工（或脚本）在 Releases 页面点 Publish。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # 测试门禁：不通过则不进入三平台构建
  test:
    name: 测试门禁（前端构建 + Rust 测试）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖（WebKitGTK 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust 格式检查
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: 安装前端依赖
        run: npm ci

      - name: 前端回归测试
        run: npm test

      - name: 前端类型检查与生产构建
        run: npm run build

      - name: Rust 单元与集成测试（SQLite 默认运行，其余驱动未配置时跳过）
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (M 系列)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Linux 系统依赖（WebKitGTK 等）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并上传安装包到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SQLink ${{ github.ref_name }}
          releaseBody: |
            跨平台桌面数据库管理工具（MySQL / PostgreSQL / SQLite / SQL Server）。

            ## 下载说明

            | 平台 | 文件 |
            | --- | --- |
            | Windows | `SQLink_x.x.x_x64-setup.exe`（NSIS 安装包，推荐）/ `.msi` / `-portable.zip`（解压直用） |
            | macOS | `aarch64`（Apple Silicon）或 `x64`（Intel）的 `.dmg`；未签名，首次打开请右键 → 打开 |
            | Linux | `.deb`（Debian/Ubuntu）/ `.AppImage`（通用）/ `.rpm` |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: 制作 Windows 便携版 zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/sqlconnect.exe portable/SQLink.exe
          Compress-Archive -Path portable/SQLink.exe -DestinationPath "SQLink-${{ github.ref_name }}-portable.zip" -Force

      - name: 上传便携版 zip 到 Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SQLink-${{ github.ref_name }}-portable.zip
